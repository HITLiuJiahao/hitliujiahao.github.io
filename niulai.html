<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="问牛来：搜索 A 股、港股和美股，用腾讯公开资料、新闻与量价图表了解股票。支持缓存和数据时间核对。">
  <title>问牛来 · 股票值得买吗</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ef4844'/%3E%3Cpath d='m5 24 7-8 5 4 9-13m-7 1 8-2-1 8' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=11">
  <link rel="stylesheet" href="niulai.css?v=9">
  <script src="stock-catalog.js" defer></script>
  <script src="stock-directory-cn.js?v=3" defer></script>
  <script src="stock-directory-cn-2.js?v=3" defer></script>
  <script src="stock-directory-cn-3.js?v=3" defer></script>
  <script src="stock-directory-hk.js?v=3" defer></script>
  <script src="stock-directory-hk-2.js?v=3" defer></script>
  <script src="stock-directory-us.js?v=3" defer></script>
  <script src="stock-directory-us-2.js?v=3" defer></script>
  <script src="stock-directory-us-3.js?v=3" defer></script>
  <script src="niulai-cache.js?v=5" defer></script>
  <script src="stock-market-map.js?v=5" defer></script>
  <script src="niulai-quotes.js?v=5" defer></script>
  <script src="niulai-data.js?v=5" defer></script>
  <script src="niulai-verdict.js?v=7" defer></script>
  <script src="niulai-charts.js?v=9" defer></script>
  <script src="niulai.js?v=10" defer></script>
</head>
<body>
  <div class="app-shell niulai-shell">
    <p class="demo-notice">独立学习项目 · 非腾讯官方</p>
    <header class="niulai-page-header">
      <a class="niulai-back" href="index.html" aria-label="返回腾讯微证券首页">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        <span>返回</span>
      </a>
      <span class="niulai-page-title">问牛来</span>
    </header>
    <main class="niulai-page-content" id="niulai-main">
      <section class="nl-hero" aria-labelledby="niulai-heading">
        <div class="nl-hero-copy">
          <h1 id="niulai-heading">股票是不是值得买？<br><strong>问牛来！</strong></h1>
        </div>
        <img class="nl-hero-mascot" src="assets/niulai.jpg" alt="牛来拿着平板，向你竖起大拇指" width="1254" height="1254" decoding="async">
      </section>

      <section class="nl-card nl-search-card" aria-labelledby="search-heading">
        <div class="nl-card-heading">
          <h2 id="search-heading">选一只你关心的股票</h2>
        </div>
        <form id="stock-form" novalidate>
          <div class="nl-market-filters" role="group" aria-label="筛选股票市场">
            <button class="is-active" type="button" data-market="all" aria-pressed="true">全部</button>
            <button type="button" data-market="CN" aria-pressed="false">A 股</button>
            <button type="button" data-market="HK" aria-pressed="false">港股</button>
            <button type="button" data-market="US" aria-pressed="false">美股</button>
          </div>
          <div class="nl-search-wrap" id="search-wrap">
            <label class="nl-sr-only" for="stock-query">输入股票名称、代码或拼音首字母</label>
            <div class="nl-search-field" id="search-field">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
              <input id="stock-query" type="text" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="stock-options" aria-describedby="search-help search-error" placeholder="股票名称 / 代码 / 拼音首字母" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" maxlength="60">
              <button class="nl-clear" id="clear-query" type="button" aria-label="清空股票搜索" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
            </div>
            <div class="nl-suggestions" id="suggestions" hidden>
              <div class="nl-suggestion-heading"><span id="suggestion-caption">猜你想找</span><span id="match-count"></span></div>
              <div id="stock-options" role="listbox" aria-label="匹配的股票"></div>
              <p class="nl-no-matches" id="no-matches" hidden></p>
            </div>
          </div>
          <p class="nl-sr-only" id="search-help">支持名称、代码和拼音首字母</p>
          <p class="nl-search-error" id="search-error" role="alert" hidden></p>
          <div class="nl-selected-stock" id="selected-stock" hidden></div>
          <div class="nl-quick-picks"><span>试试</span><div id="quick-picks"></div></div>
          <button class="nl-ask-button" id="ask-niulai" type="submit">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4L12 3Z"/></svg>
            <span id="ask-label">问牛来值不值得买</span>
            <svg class="icon nl-button-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
          </button>
          <details class="nl-catalog-details"><summary><b id="catalog-note" role="status">正在载入股票目录…</b> <span aria-hidden="true">›</span></summary><div id="catalog-coverage"></div><p>沪深北 A 股、港股及美股交易所证券；少量特殊证券可能暂无报价。新上市或更名需更新目录。</p><p>名单来源：交易所、巨潮资讯及腾讯行情。</p><div class="nl-source-links"><a href="https://www.sse.com.cn/assortment/stock/list/share/" target="_blank" rel="noopener noreferrer">上交所</a><a href="https://www.szse.cn/market/stock/company/" target="_blank" rel="noopener noreferrer">深交所</a><a href="https://www.cninfo.com.cn/" target="_blank" rel="noopener noreferrer">巨潮资讯</a><a href="https://www.hkex.com.hk/Services/Trading/Securities/Securities-Lists?sc_lang=zh-HK" target="_blank" rel="noopener noreferrer">港交所</a><a href="https://www.nasdaqtrader.com/Trader.aspx?id=SymbolDirDefs" target="_blank" rel="noopener noreferrer">Nasdaq</a></div></details>
        </form>
      </section>

      <section class="nl-card nl-advice-card" id="advice-card" aria-labelledby="advice-heading" aria-busy="false">
        <div class="nl-card-heading">
          <div class="nl-advice-title"><span class="nl-avatar"><img src="assets/niulai.jpg" alt="" width="1254" height="1254"></span><h2 id="advice-heading">牛来建议</h2></div>
          <span class="nl-demo-tag nl-real-tag">AI 建议（当前为规则生成）</span>
        </div>
        <div id="advice-content">
          <div class="nl-empty-advice">
            <h3>选好股票，牛来帮你理思路</h3>
            <div class="nl-perspectives">
              <div><span class="nl-perspective-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4v16h18M6 15l4-5 4 3 6-7m-5 0h5v5"/></svg></span><strong>价格与成交量</strong></div>
              <div><span class="nl-perspective-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V8h7v13M11 4h9v17M8 12H7m1 4H7m8-8h1m-1 4h1m-1 4h1M2 21h20"/></svg></span><strong>行业资讯</strong></div>
              <div><span class="nl-perspective-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3c1 5-3 5-2 9 2 0 3-2 3-4 4 4 5 7 3 10-3 5-10 3-11-1-1-4 2-6 3-8 0 3 1 3 2 3"/></svg></span><strong>热点新闻</strong></div>
            </div>
            <button class="nl-example-button" id="show-example" type="button">先选一只看看 <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
          </div>
        </div>
        <p class="nl-advice-disclaimer">数据可能延迟，不构成买卖建议。</p>
      </section>
      <p id="niulai-status" class="nl-sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      <noscript><p class="nl-noscript">请启用浏览器 JavaScript，以使用股票搜索和资料图表。</p></noscript>
    </main>
  </div>
</body>
</html>
