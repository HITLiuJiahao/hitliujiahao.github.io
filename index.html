<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="根据参考截图制作的腾讯微证券首页前端演示。">
  <title>腾讯微证券 · 首页复刻</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ef4844'/%3E%3Cpath d='m5 24 7-8 5 4 9-13m-7 1 8-2-1 8' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=19">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="8"/><path d="m16.5 16.5 5 5"/></symbol>
      <symbol id="i-user" viewBox="0 0 28 28"><path d="M14 2c-4 0-6.5 3-6.5 7.2 0 3 1.2 5.1 3.3 6.6v3c-5.7 1.4-9 3.2-9 6.2h24.4c0-3-3.3-4.8-9-6.2v-3c2.1-1.5 3.3-3.6 3.3-6.6C20.5 5 18 2 14 2Z"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 12 20"><path d="m3 3 6 7-6 7"/></symbol>
      <symbol id="i-flash" viewBox="0 0 32 32"><path d="M12 3 4 18h10l-3 10c-.4 1.4.6 2 1.6 1L29 16H18l7-13Z"/></symbol>
      <symbol id="i-ipo" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14"/><path d="M7.7 12v8M12 20v-8h2a2.3 2.3 0 0 1 0 4.6h-2M23.2 14a2.4 2.4 0 0 0-4.8 0v4a2.4 2.4 0 0 0 4.8 0Z"/></symbol>
      <symbol id="i-fire" viewBox="0 0 24 28"><path d="M13.2 1.5c1.2 5.8-3.4 5.6-1.2 10.2 2.2 0 3.9-2.3 4.2-4.1 4.4 6 6.7 14.9-.9 18.2 2.5-4.6-1.8-5.7-3.2-8.3-1.1 2.5-4.8 4.7-2 8.3C.4 23.6 1.4 15.4 5.4 10.3c-.2 3.2 1 3.7 2.4 4.3C5.9 8.7 10.6 7.4 13.2 1.5Z"/></symbol>
      <symbol id="i-sectors" viewBox="0 0 32 32"><path d="M7 3h21v22M3 7h21v23H3Z"/><path d="M14 12c.8 3.4-3.4 3.9-1.2 6.4 1.3-.1 2.4-1.3 2.7-2.9 5 5.3 3 10-1.7 10-5.8 0-6.8-5.2-3.5-8.7.1 2 1.1 2.2 1.4 2.1-1-3.3 2.3-3.9 2.3-6.9Z"/></symbol>
      <symbol id="i-fund" viewBox="0 0 34 34"><path d="M14 3C7-1 2 10 3 18c.5 9 8 13 16 12 9-1 13-7 11-16C29 5 22 0 18 3c-3 4 5 4 6 9 .8 4-3 5-1 8 1 3 4 3 2 6M11 4c3 3 .5 6-2 9-3 4-3 10 3 13 3 2 6 1 8 0M29 24l3 2"/><path d="m15 14 3 3-3 3-3-3Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-etf" viewBox="0 0 32 34"><path d="M27 17V3H3v27h15M8 11h5m-5 0-1 8h5m-4-4h4m3-4h7m-3 0-1 8m6-8h4m-4 0-1 8m1-4h3"/><path d="M26 18c-1 3-5 5-5 8a5 5 0 0 0 10 0c0-2-2-4-3-5 0 2-2 2-2 2s-1-2 0-5Z"/></symbol>
      <symbol id="i-compass" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12.3" fill="var(--compass-fill,none)"/><path d="m19 9-3.1 6.9L9 19l3.1-6.9Z" fill="var(--compass-needle,none)" stroke="var(--compass-needle,currentColor)"/></symbol>
      <symbol id="i-chart" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12"/><path d="m6.5 17 6-6 4 3 5-6m-5 0h5v5"/></symbol>
      <symbol id="i-bars" viewBox="0 0 28 28"><path d="M4 17h6v9H4Zm7-7h6v16h-6Zm7-7h6v23h-6Z"/></symbol>
      <symbol id="i-trade" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12"/><path d="M7 11h14l-5-4M21 17H7l5 4"/></symbol>
      <symbol id="i-heart" viewBox="0 0 30 30"><path d="M27.1 14.5C31 6.1 21.3.9 15 7.2 8.7.9-1 6.1 2.9 14.5c1.6 3.5 7 8.4 12.1 12.4l2-1.7M23 17v9m-4.5-4.5h9"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 10-11"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    </defs>
  </svg>

  <div class="app-shell">
    <p class="demo-notice">非腾讯官方，仅供学习演示</p>
    <header class="app-header">
      <div class="brand-row">
        <div class="brand" aria-label="腾讯微证券界面复刻演示">
          <span class="brand-logo" role="img" aria-label="腾讯微证券标志"></span>
          <h1>腾讯微证券</h1>
          <span class="official-badge">演示复刻</span>
        </div>
        <div class="mini-program-tools" aria-label="小程序工具">
          <button type="button" data-action="menu" aria-label="更多选项" class="more-dots"><i></i><i></i><i></i></button>
          <span class="capsule-divider"></span>
          <button type="button" data-action="minimize" aria-label="收起页面"><span class="minus"></span></button>
          <span class="capsule-divider"></span>
          <button type="button" data-action="about" aria-label="关于此页面"><span class="mini-close"></span></button>
        </div>
      </div>
      <div class="search-row">
        <button class="search-entry" type="button" data-action="search"><svg class="icon"><use href="#i-search"/></svg><span>搜索问元宝，投资问题有答案</span></button>
        <button class="yuanbao-entry" type="button" data-action="yuanbao">问元宝</button>
        <button class="profile-entry" type="button" data-action="profile" aria-label="个人中心，有新消息"><svg class="icon"><use href="#i-user"/></svg><span class="unread-dot"></span></button>
      </div>
    </header>

    <div class="content-region">
      <main id="main-scroll" class="main-scroll">
        <section id="discover-view" class="view">
          <div class="promotion">
            <span class="benefit-icon" aria-hidden="true"><span></span></span>
            <p>参与领<span class="red">8.88%</span>新客理财福利</p>
            <button type="button" class="primary-button open-account" data-action="account">立即开户</button>
          </div>

          <nav class="shortcuts" aria-label="常用服务">
            <button type="button" class="shortcut" data-action="account"><span class="shortcut-icon"><svg class="icon"><use href="#i-flash"/></svg><span class="shortcut-badge">新客理财</span></span><span>立即开户</span></button>
            <button type="button" class="shortcut" data-action="ipo"><span class="shortcut-icon"><svg class="icon"><use href="#i-ipo"/></svg></span><span>打新日历</span></button>
            <button type="button" class="shortcut" data-action="sectors"><span class="shortcut-icon"><svg class="icon"><use href="#i-sectors"/></svg></span><span>热门板块</span></button>
            <button type="button" class="shortcut" data-action="fund"><span class="shortcut-icon"><svg class="icon"><use href="#i-fund"/></svg></span><span>买基金</span></button>
            <button type="button" class="shortcut" data-action="etf"><span class="shortcut-icon"><svg class="icon"><use href="#i-etf"/></svg></span><span>热门ETF</span></button>
            <button type="button" class="shortcut" data-action="services"><span class="shortcut-icon"><svg class="icon"><use href="#i-chart"/></svg></span><span>微信理财</span></button>
          </nav>

          <div class="discovery-content">
            <a class="niulai-card" href="niulai.html?v=23" aria-label="新功能上线：购股新习惯，先让牛来看。立即进入牛来">
              <span class="niulai-new-tag">新功能上线</span>
              <div class="niulai-card-copy">
                <h2>购股新习惯，<span>先让牛来看</span></h2>
                <span class="niulai-card-cta"><span>立即进入</span><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></span>
              </div>
              <img class="niulai-card-mascot" src="assets/niulai.jpg" alt="牛来" width="1254" height="1254" decoding="async">
            </a>

            <section class="feature-cards" aria-label="市场资讯与自选情报">
              <article class="feature-card news-card">
                <button class="card-heading" type="button" data-action="news"><h2 class="slanted-title">市场<span class="title-accent">快</span>讯</h2><svg class="icon chevron"><use href="#i-chevron"/></svg></button>
                <button class="news-body" type="button" data-action="news"><h3>全国首个海洋智能<br>要素平台落地青岛</h3><p>海洋产业数智化提速</p></button>
                <button class="sector-chip" type="button" data-action="sector-detail"><span class="sector-badge">板</span><strong>词元概念</strong><span class="red">+1.50%</span></button>
              </article>
              <article class="feature-card intelligence-card">
                <button class="card-heading" type="button" data-action="intelligence"><h2 class="slanted-title">自选<span class="title-accent">情</span>报</h2><svg class="icon chevron"><use href="#i-chevron"/></svg></button>
                <div class="radar-image" role="img" aria-label="自选情报：追踪公告、涨跌停与异动"></div>
                <p id="intelligence-caption">添加自选开启异动追踪</p>
                <button class="outline-button" type="button" data-action="add-stock">立即添加</button>
              </article>
            </section>

            <section class="hot-stocks" aria-labelledby="hot-stocks-heading">
              <div class="section-heading"><h2 id="hot-stocks-heading" class="slanted-title">微信<span class="title-accent">热</span>股榜</h2><button class="more-link" type="button" data-action="more-stocks">查看更多<svg class="icon chevron"><use href="#i-chevron"/></svg></button></div>
              <div class="ranking-card">
                <div class="ranking-tabs" role="tablist" aria-label="热股榜分类">
                  <button id="tab-hot" class="ranking-tab active" type="button" role="tab" aria-controls="stock-list" aria-selected="true" data-ranking="hot">微信热搜</button>
                  <button id="tab-streak" class="ranking-tab" type="button" role="tab" aria-controls="stock-list" aria-selected="false" tabindex="-1" data-ranking="streak">连续涨停</button>
                  <button id="tab-inflow" class="ranking-tab" type="button" role="tab" aria-controls="stock-list" aria-selected="false" tabindex="-1" data-ranking="inflow">主力净流入</button>
                </div>
                <div id="stock-list" role="tabpanel" aria-labelledby="tab-hot">
                  <article class="stock-item">
                    <div class="stock-summary">
                      <svg class="sparkline" viewBox="0 0 130 65" aria-label="长电科技走势"><defs><linearGradient id="spark-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eabdbd" stop-opacity=".65"/><stop offset="100%" stop-color="#eabdbd" stop-opacity=".17"/></linearGradient></defs><path d="M1 59 6 57 13 51 19 57 23 57 29 62 33 61 36 46 39 48 43 41 48 37 53 40 56 41 58 45 63 41 67 42 72 37 78 41 83 37 88 36 94 32 99 22 104 23 110 18 116 19 122 12 129 6V64H1Z" fill="url(#spark-fill)"/><path d="M1 59 6 57 13 51 19 57 23 57 29 62 33 61 36 46 39 48 43 41 48 37 53 40 56 41 58 45 63 41 67 42 72 37 78 41 83 37 88 36 94 32 99 22 104 23 110 18 116 19 122 12 129 6" fill="none" stroke="#f15353" stroke-width="1"/></svg>
                      <button class="stock-name" type="button" data-stock="长电科技"><span class="rank-number">1</span><span>长电科技</span></button>
                      <div class="stock-metrics"><div class="heat-metric"><strong><svg class="icon"><use href="#i-fire"/></svg>2.93万</strong><span>搜索热度</span></div><div class="change-metric"><strong class="red">+8.71%</strong><span>今日涨跌</span></div></div>
                      <button class="favorite-button" type="button" data-favorite="长电科技" aria-label="添加长电科技到自选" aria-pressed="false"><svg class="icon"><use href="#i-heart"/></svg></button>
                    </div>
                    <button class="stock-news" type="button" data-stock="长电科技"><span>▤</span><strong>公司大事</strong><span>拟定增45亿扩产先进封装</span><svg class="icon chevron"><use href="#i-chevron"/></svg></button>
                  </article>
                </div>
                <p class="data-note">页面演示数据</p>
              </div>
            </section>
          </div>
        </section>
        <section id="watchlist-view" class="view secondary-view" hidden></section>
        <section id="markets-view" class="view secondary-view" hidden></section>
        <section id="trade-view" class="view secondary-view" hidden></section>
      </main>
      <div class="scroll-rail" aria-hidden="true"><div class="scroll-thumb"></div></div>
    </div>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" type="button" data-view="discover" aria-current="page"><svg class="icon"><use href="#i-compass"/></svg><span>发现</span></button>
      <button class="nav-item" type="button" data-view="watchlist"><svg class="icon"><use href="#i-chart"/></svg><span>自选</span></button>
      <button class="nav-item" type="button" data-view="markets"><svg class="icon"><use href="#i-bars"/></svg><span>行情</span></button>
      <button class="nav-item" type="button" data-view="trade"><svg class="icon"><use href="#i-trade"/></svg><span>交易</span></button>
    </nav>

    <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="dialog-title">
      <div class="dialog-top"><h2 id="dialog-title"></h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭弹窗"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
